<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Baraban O'yini</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
.balance-box {
  background: rgba(255,255,255,0.1);
  border-radius: 15px;
  padding: 15px 30px;
  margin: 20px 0;
  text-align: center;
  width: 100%;
}
.balance-box h2 { font-size: 14px; color: #aaa; }
.balance-box .amount { font-size: 32px; font-weight: bold; color: #ffd700; }
.slot-machine {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,215,0,0.3);
  border-radius: 20px;
  padding: 30px;
  margin: 20px 0;
  width: 100%;
  text-align: center;
}
.reels {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}
.reel {
  background: rgba(0,0,0,0.4);
  border: 2px solid #ffd700;
  border-radius: 15px;
  width: 80px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  transition: all 0.3s;
}
.reel.spinning { animation: spin 0.1s infinite; }
@keyframes spin {
  0% { transform: translateY(-5px); }
  50% { transform: translateY(5px); }
  100% { transform: translateY(-5px); }
}
.result-msg {
  font-size: 20px;
  font-weight: bold;
  margin: 10px 0;
  min-height: 30px;
}
.win { color: #00ff88; }
.lose { color: #ff4444; }
.jackpot { color: #ffd700; font-size: 24px; }
.stavka-title { font-size: 14px; color: #aaa; margin-bottom: 10px; }
.stavka-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0;
  width: 100%;
}
.stavka-btn {
  background: rgba(255,215,0,0.15);
  border: 1px solid rgba(255,215,0,0.4);
  color: #ffd700;
  padding: 10px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}
.stavka-btn:active, .stavka-btn.selected {
  background: rgba(255,215,0,0.4);
  transform: scale(0.95);
}
.custom-input {
  display: flex;
  gap: 8px;
  margin: 10px 0;
  width: 100%;
}
.custom-input input {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 10px;
  border-radius: 10px;
  font-size: 16px;
}
.spin-btn {
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  color: #1a1a2e;
  border: none;
  padding: 15px;
  border-radius: 15px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
  transition: all 0.2s;
}
.spin-btn:active { transform: scale(0.97); }
.spin-btn:disabled { opacity: 0.5; }
</style>
</head>
<body>

<div class="balance-box">
  <h2>💵 Balansingiz</h2>
  <div class="amount" id="balance">$0.00</div>
</div>

<div class="slot-machine">
  <div class="reels">
    <div class="reel" id="reel1">🎰</div>
    <div class="reel" id="reel2">🎰</div>
    <div class="reel" id="reel3">🎰</div>
  </div>
  <div class="result-msg" id="result"></div>
</div>

<div style="width:100%">
  <div class="stavka-title">💰 Stavka tanlang:</div>
  <div class="stavka-grid">
    <button class="stavka-btn" onclick="selectStavka(50)">$50</button>
    <button class="stavka-btn" onclick="selectStavka(100)">$100</button>
    <button class="stavka-btn" onclick="selectStavka(500)">$500</button>
    <button class="stavka-btn" onclick="selectStavka(1000)">$1000</button>
    <button class="stavka-btn" onclick="selectStavka(5000)">$5000</button>
    <button class="stavka-btn" onclick="selectStavka(10000)">$10000</button>
  </div>
  <div class="custom-input">
    <input type="number" id="customAmount" placeholder="O'zim yozay..." min="50">
  </div>
  <button class="spin-btn" id="spinBtn" onclick="doSpin()">🎰 AYLANISH</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const SYMBOLS = ["🍒","🍋","🍊","⭐","💎","7️⃣"];
let selectedStavka = 0;
let balance = 0;
let isSpinning = false;

// Balansni botdan olish
tg.onEvent("message", function(data) {
  if (data.balance !== undefined) {
    balance = data.balance;
    updateBalance();
  }
});

// Boshlanganda balansni so'rash
tg.sendData(JSON.stringify({action: "get_balance"}));

function updateBalance() {
  document.getElementById("balance").textContent = "$" + balance.toFixed(2);
}

function selectStavka(amount) {
  selectedStavka = amount;
  document.getElementById("customAmount").value = amount;
  document.querySelectorAll(".stavka-btn").forEach(b => b.classList.remove("selected"));
  event.target.classList.add("selected");
}

async function doSpin() {
  const customVal = parseFloat(document.getElementById("customAmount").value);
  const stavka = customVal || selectedStavka;

  if (!stavka || stavka < 50) {
    alert("Minimal stavka $50!");
    return;
  }
  if (stavka > balance) {
    alert("Balans yetarli emas!");
    return;
  }
  if (isSpinning) return;

  isSpinning = true;
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("result").textContent = "";

  // Animatsiya
  const reels = ["reel1","reel2","reel3"];
  reels.forEach(r => document.getElementById(r).classList.add("spinning"));

  await sleep(800);
  const r1 = randomSymbol();
  document.getElementById("reel1").textContent = r1;
  document.getElementById("reel1").classList.remove("spinning");

  await sleep(600);
  const r2 = randomSymbol();
  document.getElementById("reel2").textContent = r2;
  document.getElementById("reel2").classList.remove("spinning");

  await sleep(600);
  const r3 = randomSymbol();
  document.getElementById("reel3").textContent = r3;
  document.getElementById("reel3").classList.remove("spinning");

  // Natija
  const resultEl = document.getElementById("result");
  let win = 0;
  let msg = "";

  if (r1 === r2 && r2 === r3) {
    win = stavka * 10;
    msg = "🎉 JACKPOT! +" + win.toFixed(2) + "$";
    resultEl.className = "result-msg jackpot";
  } else if (r1 === r2 || r2 === r3) {
    win = stavka * 2;
    msg = "✅ Yutdingiz! +" + win.toFixed(2) + "$";
    resultEl.className = "result-msg win";
  } else {
    win = -stavka;
    msg = "❌ Omadsiz. -" + stavka.toFixed(2) + "$";
    resultEl.className = "result-msg lose";
  }

  resultEl.textContent = msg;
  balance += win;
  updateBalance();

  // Botga yuborish
  tg.sendData(JSON.stringify({
    action: "spin",
    stavka: stavka,
    result: [r1, r2, r3],
    win: win
  }));

  isSpinning = false;
  document.getElementById("spinBtn").disabled = false;
}

function randomSymbol() {
  return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
</body>
      </html>
